    <text x="700" y="448" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="white">05:22</text>
    
    <rect x="570" y="475" width="160" height="1" fill="#F0E68C" fill-opacity="0.3" stroke-dasharray="2 2" />
    
    <rect x="570" y="495" width="10" height="10" rx="2" fill="#F0E68C" />
    <rect x="590" y="495" width="100" height="6" rx="3" fill="#8B4513" />
    <rect x="590" y="510" width="60" height="4" rx="2" fill="#8B4513" fill-opacity="0.4" />
    
    <rect x="570" y="535" width="10" height="10" rx="2" fill="#F0E68C" />
    <rect x="590" y="535" width="80" height="6" rx="3" fill="#8B4513" />
  </g>
</svg>
