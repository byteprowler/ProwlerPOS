<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- KDS Screen -->
  <rect x="50" y="50" width="700" height="500" rx="32" fill="#0F0F0F" stroke="#333333" stroke-width="4" />
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="32" fill="#1A1A1A" />
  <circle cx="90" cy="80" r="8" fill="#246BF5" />
  <text x="110" y="85" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="white" letter-spacing="0.2em">KITCHEN DISPLAY SYSTEM</text>
  
  <!-- Tickets Grid -->
  <g>
    <!-- Ticket 1 -->
    <rect x="80" y="140" width="200" height="300" rx="20" fill="#1A1A1A" stroke="#333333" stroke-width="1" />
    <rect x="80" y="140" width="200" height="40" rx="20" fill="#246BF5" />
    <text x="100" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="white">#882</text>
    <text x="240" y="165" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="end">08:12</text>
    
    <rect x="100" y="200" width="120" height="8" rx="4" fill="white" />
    <rect x="100" y="220" width="160" height="6" rx="3" fill="#8C8C8C" />
    <rect x="100" y="240" width="100" height="8" rx="4" fill="white" />
    
    <!-- Ticket 2 -->
    <rect x="300" y="140" width="200" height="300" rx="20" fill="#1A1A1A" stroke="#FFA500" stroke-width="1" stroke-opacity="0.5" />
    <rect x="300" y="140" width="200" height="40" rx="20" fill="#FFA500" />
    <text x="320" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="white">#883</text>
    
    <rect x="320" y="200" width="120" height="8" rx="4" fill="white" />
    <rect x="320" y="230" width="140" height="8" rx="4" fill="white" />
    
    <!-- Ticket 3 -->
    <rect x="520" y="140" width="200" height="300" rx="20" fill="#1A1A1A" stroke="#CECECE" stroke-width="1" stroke-opacity="0.1" />
    <rect x="520" y="140" width="200" height="40" rx="20" fill="#333333" />
    <text x="540" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#8C8C8C">#879</text>
  </g>

  <!-- Footer Stats -->
  <rect x="50" y="500" width="700" height="50" rx="32" fill="#1A1A1A" />
  <text x="80" y="530" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#8C8C8C" letter-spacing="0.1em">3 ACTIVE TICKETS</text>
  <text x="650" y="530" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#246BF5" letter-spacing="0.1em">SYSTEM SYNCED</text>
</svg>
