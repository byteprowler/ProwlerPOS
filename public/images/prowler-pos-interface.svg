<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- POS Window -->
  <rect x="50" y="50" width="700" height="500" rx="32" fill="white" stroke="#CECECE" stroke-width="1" />
  <rect x="50" y="50" width="700" height="60" rx="32" fill="#F9FAFB" />
  <rect x="50" y="110" width="700" height="1" fill="#CECECE" />
  
  <!-- Content Area -->
  <rect x="80" y="140" width="400" height="380" rx="20" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
  <g>
    <!-- Grid of items -->
    <rect x="100" y="160" width="100" height="100" rx="12" fill="white" stroke="#CECECE" stroke-width="1" />
    <rect x="230" y="160" width="100" height="100" rx="12" fill="#246BF5" />
    <rect x="360" y="160" width="100" height="100" rx="12" fill="white" stroke="#CECECE" stroke-width="1" />
    
    <rect x="100" y="280" width="100" height="100" rx="12" fill="white" stroke="#CECECE" stroke-width="1" />
    <rect x="230" y="280" width="100" height="100" rx="12" fill="white" stroke="#CECECE" stroke-width="1" />
    <rect x="360" y="280" width="100" height="100" rx="12" fill="white" stroke="#CECECE" stroke-width="1" />
  </g>

  <!-- Checkout Sidebar -->
  <rect x="510" y="140" width="210" height="380" rx="20" fill="white" stroke="#CECECE" stroke-width="1" />
  <text x="530" y="175" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#8C8C8C" letter-spacing="0.1em">CURRENT ORDER</text>
  
  <rect x="530" y="200" width="170" height="1" fill="#F9FAFB" />
  <rect x="530" y="220" width="120" height="8" rx="4" fill="#0F0F0F" />
  <rect x="670" y="220" width="30" height="8" rx="4" fill="#0F0F0F" />
  
  <rect x="530" y="250" width="120" height="8" rx="4" fill="#0F0F0F" />
  <rect x="670" y="250" width="30" height="8" rx="4" fill="#0F0F0F" />
  
  <rect x="530" y="420" width="170" height="1" fill="#CECECE" />
  <text x="530" y="450" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#8C8C8C">TOTAL</text>
  <text x="630" y="450" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#0F0F0F">$21.00</text>
  
  <rect x="530" y="470" width="170" height="40" rx="12" fill="#246BF5" />
  <text x="580" y="495" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="white" letter-spacing="0.1em">PAY NOW</text>
</svg>
