<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar / Scheduler Illustration -->
  <rect x="150" y="100" width="500" height="400" rx="40" fill="white" stroke="#CECECE" stroke-width="1" />
  
  <rect x="150" y="100" width="500" height="80" rx="40" fill="#F9FAFB" />
  <text x="400" y="145" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#0F0F0F" text-anchor="middle" letter-spacing="0.1em">SCHEDULE YOUR WALKTHROUGH</text>
  
  <!-- Calendar Grid -->
  <g transform="translate(200, 220)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    <rect x="60" y="0" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    <rect x="120" y="0" width="40" height="40" rx="8" fill="#246BF5" />
    <rect x="180" y="0" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    <rect x="240" y="0" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    
    <rect x="0" y="60" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    <rect x="60" y="60" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
    <rect x="120" y="60" width="40" height="40" rx="8" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
  </g>
  
  <!-- Time Slots -->
  <rect x="200" y="380" width="120" height="40" rx="12" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
  <rect x="340" y="380" width="120" height="40" rx="12" fill="#0F0F0F" />
  <rect x="480" y="380" width="120" height="40" rx="12" fill="#F9FAFB" stroke="#CECECE" stroke-width="1" />
</svg>
